spring.application.name=backend-pedidos
server.port=8080

# 1. Auth0 (Validacion JWT OAuth2)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-ukv714fluyvpdwzv.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev-ukv714fluyvpdwzv.us.auth0.com/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=https://api-pedidos-360.azurewebsites.net

# 2. Base de datos: por defecto H2 local; en la nube se define con variables de entorno (Azure SQL)
spring.datasource.url=${SQL_DB_URL:jdbc:h2:file:./data/pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# 3. Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 4. Consola Web H2 (solo se usa en local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 5. Logs
logging.level.org.springframework.security=INFO

# 6. Azure Service Bus
spring.cloud.azure.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING}
app.servicebus.topic=pedidos-topic

# 7. Apache Kafka (apagado por defecto; en local: KAFKA_ENABLED=true)
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
app.kafka.topic.pedidos-creados=pedidos-creados
app.kafka.topic.alertas-stock=alertas-stock

# 8. Pool de conexiones: cerrar las conexiones sin uso para que Azure SQL serverless pueda pausarse
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000

# 9. Kafka propio: se desactiva la integracion de Azure con Event Hubs (no se usa y busca clases que no existen)
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration,com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaAutoConfiguration
