spring.application.name=backend-pedidos
server.port=8080

# 1. Configuración de Auth0 (Validación JWT OAuth2)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-ukv714fluyvpdwzv.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://dev-ukv714fluyvpdwzv.us.auth0.com/.well-known/jwks.json

# 2. Base de Datos H2 Persistente en Disco (No se borra al actualizar)
spring.datasource.url=jdbc:h2:file:./data/pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Hibernate y JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Consola Web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 5. Logs de Seguridad para Depuración
logging.level.org.springframework.security=INFO

spring.cloud.azure.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING}
app.servicebus.topic=pedidos-topic
spring.security.oauth2.resourceserver.jwt.audiences=https://api-pedidos-360.azurewebsites.net
