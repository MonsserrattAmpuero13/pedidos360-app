# Kafka UI: administración de brokers y tópicos
# Requiere que el clúster esté arriba (crea antes la red kafka-net con docker-compose.kafka.yml)
# Levantar:  docker compose -f docker-compose.kafka-ui.yml up -d
# Abrir:     http://localhost:8090

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true
    name: kafka-net
